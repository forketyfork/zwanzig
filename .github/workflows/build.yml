name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  documentation-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check documented versions
        run: ./scripts/check-doc-versions.sh

  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'test/**'
              - 'build.zig'
              - 'build.zig.zon'
              - 'flake.nix'
              - 'flake.lock'
              - 'justfile'
              - 'scripts/**'
              - 'validate.sh'
              - 'examples/**'
              - '.github/workflows/**'

  build-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zwanzig/.zig-cache
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/zwanzig/.zig-cache/local
    steps:
      - uses: actions/checkout@v7
        with:
          path: zwanzig

      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Zig build cache
        uses: actions/cache@v6
        with:
          path: zwanzig/.zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('zwanzig/build.zig', 'zwanzig/build.zig.zon', 'zwanzig/src/**', 'zwanzig/test/**', 'zwanzig/flake.lock') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Cache Nix store
        uses: cachix/cachix-action@v17
        with:
          name: forketyfork
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build, test, lint
        run: |
          for i in 1 2 3; do
            nix develop --accept-flake-config --command just ci && break
            if [ $i -eq 3 ]; then exit 1; fi
            sleep 5
          done
        working-directory: zwanzig

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.0
        with:
          sarif_file: zwanzig/results.sarif

  build:
    name: build
    needs: [documentation-versions, changes, build-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.documentation-versions.result }}" != "success" ]]; then
            echo "Documentation version check failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.code }}" == "false" ]]; then
            echo "Documentation-only change, skipping build"
            exit 0
          fi
          if [[ "${{ needs.build-matrix.result }}" == "success" ]]; then
            echo "Build succeeded"
            exit 0
          fi
          echo "Build failed"
          exit 1
