---
name: Release

'on':
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: validate (${{ matrix.zig_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig_version:
          - '0.15.2'
          - '0.16.0'
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      - name: Run release checks
        run: ./scripts/release-check.sh "${{ github.ref_name }}"

  release:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig_version: '0.15.2'
            asset_suffix: linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            zig_version: '0.15.2'
            asset_suffix: macos-aarch64
            archive_ext: tar.gz
          - os: windows-latest
            zig_version: '0.15.2'
            asset_suffix: windows-x86_64
            archive_ext: zip
          - os: ubuntu-latest
            zig_version: '0.16.0'
            asset_suffix: linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            zig_version: '0.16.0'
            asset_suffix: macos-aarch64
            archive_ext: tar.gz
          - os: windows-latest
            zig_version: '0.16.0'
            asset_suffix: windows-x86_64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig_version }}

      - name: Apply Zig 0.15.2 macOS SDK workaround
        if: runner.os == 'macOS' && matrix.zig_version == '0.15.2'
        shell: bash
        run: |
          unset SDKROOT DEVELOPER_DIR
          . "$GITHUB_WORKSPACE/scripts/setup-macos-sdk-workaround.sh"

          workaround_root="$GITHUB_WORKSPACE/.tmp/macos-sdk-workaround"
          if [ -d "$workaround_root/developer" ]; then
            echo "DEVELOPER_DIR=$workaround_root/developer" >> "$GITHUB_ENV"
            echo "$workaround_root/bin" >> "$GITHUB_PATH"
          fi

      - name: Build release binary
        run: zig build -Doptimize=ReleaseFast

      - name: Set archive name
        id: archive_name
        shell: bash
        run: |
          archive="zwanzig-${{ github.ref_name }}-zig-${{ matrix.zig_version }}"
          archive="${archive}-${{ matrix.asset_suffix }}"
          archive="${archive}.${{ matrix.archive_ext }}"
          echo "name=$archive" >> "$GITHUB_OUTPUT"

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp zig-out/bin/zwanzig dist/
          cp LICENSE README.md dist/
          tar -czf "${{ steps.archive_name.outputs.name }}" -C dist .

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item zig-out/bin/zwanzig.exe dist/
          Copy-Item LICENSE, README.md dist/
          $archive = "${{ steps.archive_name.outputs.name }}"
          Compress-Archive -Path dist/* -DestinationPath $archive

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.zig_version }}-${{ matrix.asset_suffix }}
          path: ${{ steps.archive_name.outputs.name }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*
